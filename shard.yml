name: sodium
version: 0.1.0

authors:
  - Andrew Hamon
  - Didactic Drunk <1479616+didactic-drunk@users.noreply.github.com>
  - OkaVatti

crystal: ">= 1.0.0, < 2.0.0"

repository: https://github.com/OkaVatti/sodium.cr
homepage: https://github.com/OkaVatti/sodium.cr
documentation: https://okaVatti.github.io/sodium.cr

dependencies:
  crypto-secret:
    github: didactic-drunk/crypto-secret.cr
    branch: main

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"

libraries:
  libsodium: ">= 1.0.22"

license: MIT

scripts:
  postinstall: >
    pkg-config --exists 'libsodium >= 1.0.22' ||
    (echo 'libsodium >= 1.0.22 is required. Install it with your package manager.' >&2 && exit 1)

targets:
  blake2b_hash:
    main: examples/blake2b_hash.cr
  pwhash_selector:
    main: examples/pwhash_selector.cr
