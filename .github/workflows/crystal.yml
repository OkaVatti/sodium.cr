name: Crystal CI

on:
  push:
    branches: [mother]
  pull_request:
    branches: [mother]

jobs:
  test:
    name: "crystal ${{ matrix.crystal }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    env:
      LIBSODIUM_INSTALL: "1"
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        crystal:
          - "1.10.0"
          - "1.20.1"
          - latest
        include:
          - os: ubuntu-latest
            crystal: latest
            lint: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget pkg-config libssl-dev libsodium

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install wget pkgconf libsodium

      - name: Build libsodium
        run: |
          ./build/libsodium_install.sh

      - name: Verify libsodium build
        run: |
          ls -la build/libsodium/lib/libsodium.a

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-

      - name: Install shard dependencies
        run: shards install

      - name: Run tests
        run: crystal spec --error-trace --order random

      - name: Run linter
        if: matrix.lint
        run: shards exec ameba
