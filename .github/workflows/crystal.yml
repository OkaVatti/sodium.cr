name: Crystal CI

on:
  push:
    branches: [mother]
  pull_request:
    branches: [mother]

permissions:
  contents: read

jobs:
  test:
    name: "crystal ${{ matrix.crystal }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        crystal:
          - "1.10.0"
          - "1.20.1"
          - latest
        include:
          - os: ubuntu-latest
            crystal: latest
            lint: true

    steps:
      - uses: actions/checkout@v5

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget pkg-config

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install wget pkg-config

      - name: Build libsodium
        env:
          LIBSODIUM_INSTALL: "1"
          SODIUM_BUILD_VERBOSE: "1"
        run: ./build/libsodium_install.sh

      - name: Verify libsodium build
        run: test -f build/libsodium/lib/libsodium.a

      - name: Cache shards
        uses: actions/cache@v5
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-

      - name: Install shard dependencies
        env:
          LIBSODIUM_INSTALL: "1"
        run: shards install

      - name: Run tests
        env:
          LIBSODIUM_INSTALL: "1"
        run: crystal spec --error-trace --order random

      - name: Run linter
        if: matrix.lint
        run: shards exec ameba
