name: Crystal CI

on:
  push:
    branches: [mother]
  pull_request:
    branches: [mother]

jobs:
  test:
    name: "crystal ${{ matrix.crystal }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        crystal:
          - "1.10.0"
          - "1.20.1"
          - latest
        include:
          - os: ubuntu-latest
            crystal: latest
            lint: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      # Install build dependencies for libsodium
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget openssl

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install wget openssl
          # macOS already has make, clang, etc.

      # Build libsodium from source (static library)
      - name: Build libsodium
        env:
          LIBSODIUM_INSTALL: 1
          SODIUM_BUILD_VERBOSE: 1
        run: |
          ./build/libsodium_install.sh

      # Verify the static library was created
      - name: Verify libsodium build
        run: |
          ls -la build/libsodium/lib/libsodium.a

      # Cache shards
      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-

      # Install shard dependencies
      - name: Install shard dependencies
        run: shards install

      # Run tests (will use the custom libsodium via pkg-libs.sh)
      - name: Run tests
        env:
          LIBSODIUM_INSTALL: 1
        run: crystal spec --error-trace --order random

      # Run linter (only on one configuration)
      - name: Run linter
        if: matrix.lint
        run: bin/ameba
