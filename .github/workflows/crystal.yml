name: Crystal CI

on:
  push:
    branches: [mother]
  pull_request:
    branches: [mother]

jobs:
  test:
    name: "crystal ${{ matrix.crystal }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        crystal:
          - "1.10.0"
          - "1.20.1"
          - latest
        include:
          - os: ubuntu-latest
            crystal: latest
            lint: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install system libsodium (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev

      - name: Install system libsodium (macOS)
        if: runner.os == 'macOS'
        run: brew install libsodium

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-

      - name: Install shard dependencies
        run: shards install

      - name: Run tests
        run: crystal spec --error-trace --order random

      - name: Run linter
        if: matrix.lint
        run: bin/ameba
